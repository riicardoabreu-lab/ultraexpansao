<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mapa do Grupo · Infolink + Dnet + Jebnet + Giga Net</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1e2530; --text:#e8ecf1; --muted:#8b95a3; --border:#2a3240;
    --infolink:#e63050; --dnet:#2e9bff; --jebnet:#f0a637; --giganet:#8b5cf6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

  #map{position:absolute;inset:0;background:#111;}
  .leaflet-container{background:#111;}
  .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6);}

  header{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 14px; background:linear-gradient(180deg,rgba(14,17,22,.95),rgba(14,17,22,.6) 80%,transparent);
    pointer-events:none;
  }
  header > *{pointer-events:auto;}
  .brand h1{margin:0;font-size:15px;}
  .brand .sub{font-size:11px;color:var(--muted);}

  .legend{
    position:absolute; top:60px; left:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:13px; min-width:200px;
  }
  .legend h2{margin:0 0 8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .legend-row{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;user-select:none;}
  .legend-row input{accent-color:var(--cyan,#2e9bff);}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .legend-row .count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;}
  .legend-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.4;}

  .status-pill{
    position:absolute; bottom:14px; left:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:8px 14px; font-size:12px; color:var(--muted);
  }

  .login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5000;}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;width:300px;text-align:center;}
  .login-card h1{font-size:16px;margin:0 0 4px;}
  .login-card p{font-size:12px;color:var(--muted);margin:0 0 18px;}
  .login-card input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:10px;}
  .login-card button{width:100%;padding:10px;border-radius:8px;border:none;background:var(--infolink);color:#fff;font-weight:600;cursor:pointer;font-size:14px;}
  .login-card .err{color:#ff6b6b;font-size:12px;margin-top:8px;min-height:14px;}

  .marker-dot{border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.4);}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Mapa do Grupo</h1>
    <p>Infolink · Dnet · Jebnet · Giga Net Fortaleza — acesso restrito à equipe</p>
    <input type="password" id="loginSenha" placeholder="Senha" autocomplete="off">
    <button id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="map"></div>

<header style="display:none;" id="hdr">
  <div class="brand">
    <h1>Mapa do Grupo</h1>
    <div class="sub">Infolink · Dnet · Jebnet · Giga Net Fortaleza — preview, amostra parcial</div>
  </div>
</header>

<div class="legend" style="display:none;" id="legend">
  <h2>Marcas</h2>
  <div id="legendRows"></div>
  <div class="legend-note" id="legendNote"></div>
</div>

<div class="status-pill" style="display:none;" id="status">Carregando…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SENHA = 'grupoifl';

const CORES = {
  infolink: '#e63050',
  dnet: '#2e9bff',
  jebnet: '#f0a637',
  giganet_fortaleza: '#8b5cf6',
};
const NOMES = {
  infolink: 'Infolink',
  dnet: 'Dnet',
  jebnet: 'Jebnet',
  giganet_fortaleza: 'Giga Net Fortaleza',
};

const sb = createClient(
  "https://kmqzvwakxeyujefrvxsz.supabase.co",
  "sb_publishable_rilibSAUCQ3OIvH3mxZEKg_-VxLLjR6"
);

function liberarAcesso(){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('hdr').style.display = '';
  document.getElementById('legend').style.display = '';
  document.getElementById('status').style.display = '';
  iniciarMapa();
}

document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('loginSenha').addEventListener('keydown', e => { if(e.key === 'Enter') tentarLogin(); });
function tentarLogin(){
  const v = document.getElementById('loginSenha').value;
  if(v === SENHA){
    sessionStorage.setItem('mapa_grupo_auth', 'ok');
    liberarAcesso();
  } else {
    document.getElementById('loginErr').textContent = 'Senha incorreta.';
  }
}
if(sessionStorage.getItem('mapa_grupo_auth') === 'ok') liberarAcesso();

async function iniciarMapa(){
  const map = L.map('map', {preferCanvas: true, zoomControl: false}).setView([-3.75, -38.9], 10);
  window._mapaGrupoRef = map;
  L.control.zoom({position:'bottomright'}).addTo(map);
  const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri World Imagery', maxZoom: 20, maxNativeZoom: 17,
  });
  const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19, className: 'tiles-dark',
  });
  satelite.addTo(map);
  L.control.layers({'Satélite': satelite, 'Ruas': ruas}, null, {collapsed: true, position: 'topright'}).addTo(map);

  // Sem agrupamento (cluster) -- todas as caixas ficam visíveis em qualquer
  // zoom, igual o mapa-campo já faz (ver comentário lá: "todas as caixas
  // ficam visíveis o tempo todo, em qualquer nível de zoom").
  const grupos = {};
  const contagens = {};
  for(const cliente of Object.keys(CORES)){
    grupos[cliente] = L.layerGroup();
    contagens[cliente] = 0;
  }

  const status = document.getElementById('status');
  try {
    const PAGINA = 1000;
    let total = 0;
    for(let desde = 0; ; desde += PAGINA){
      const {data, error} = await sb.from('mapa_rede_grupo').select('*').range(desde, desde + PAGINA - 1);
      if(error) throw error;
      if(!data.length) break;
      for(const row of data){
        const cor = CORES[row.cliente] || '#999';
        const marker = L.marker([row.latitude, row.longitude], {
          icon: L.divIcon({
            html: `<div class="marker-dot" style="width:10px;height:10px;background:${cor};"></div>`,
            className: '', iconSize: [10, 10],
          }),
        });
        const localidadeLinha = row.localidade ? `<br>${row.localidade}` : '';
        marker.bindPopup(`<b>${row.sigla || row.id}</b><br>${NOMES[row.cliente] || row.cliente} · ${row.item}${localidadeLinha}<br>${row.municipio || ''}`);
        if(grupos[row.cliente]){
          grupos[row.cliente].addLayer(marker);
          contagens[row.cliente]++;
        }
        total++;
      }
      status.textContent = `Carregando… ${total} pontos`;
      if(data.length < PAGINA) break;
    }

    for(const cliente of Object.keys(CORES)) grupos[cliente].addTo(map);
    renderLegenda(grupos, contagens);
    status.textContent = `${total} pontos no mapa (amostra parcial — ver nota na legenda)`;
  } catch(err){
    console.error('Falha ao carregar mapa_rede_grupo:', err);
    status.textContent = 'Erro ao carregar dados: ' + (err.message || err);
  }
}

function renderLegenda(grupos, contagens){
  const rows = document.getElementById('legendRows');
  rows.innerHTML = '';
  for(const cliente of Object.keys(CORES)){
    const row = document.createElement('label');
    row.className = 'legend-row';
    row.innerHTML = `
      <input type="checkbox" checked data-cliente="${cliente}">
      <span class="dot" style="background:${CORES[cliente]};"></span>
      <span>${NOMES[cliente]}</span>
      <span class="count">${contagens[cliente]}</span>
    `;
    rows.appendChild(row);
  }
  rows.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const cliente = cb.dataset.cliente;
      const grupo = grupos[cliente];
      if(!grupo) return;
      if(cb.checked) grupo.addTo(window._mapaGrupoRef);
      else grupo.remove();
    });
  });
  document.getElementById('legendNote').textContent =
    'Amostra parcial pra preview: Dnet/Jebnet reduzidas, Giga Net Fortaleza completa. Confirme antes de carregar a base inteira.';
}
</script>
</body>
</html>
